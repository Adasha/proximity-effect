<!doctype html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, user-scalable=no">
	
	
    <title>adasha |||||| lab : proximity-effect test 1</title>
	
    <style>

        #sampleelement
        {
            display: flex;
            flex-wrap: wrap;
            flex: 1 1 auto;
            align-content: center;
            justify-content: center;
			transform: translateZ(0);
            height: 600px;
            margin-left: auto;
            margin-right: auto;
            padding: 10px;
            background: #eee;
        }

        *.childelement
        {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            box-sizing: border-box;
            margin: 5px;
            background-color: #666;
            box-shadow: 0 0 50px rgba(0,0,0,1) inset;
        }

    </style>

</head>

<body>
    
    

    <h1>ProximityEffect demo 1</h1>
    
    
    <div id="content">
        
                    

        <div id="sampleelement" class="centerpiece">


            <div class="childelement">&nbsp;</div>


        </div>


    </div>
        



<script src="https://unpkg.com/event-target@latest/min.js"></script>
<script src="../src/ProximityEffect.js"></script>

<script>

    // create the grid
    let t = document.querySelector('#sampleelement'),
        n = t.removeChild(t.querySelector('*.childelement'));

	for(let i=0; i<10; i++)
	{
		for(let j=0; j<10; j++)
		{
			t.appendChild(n.cloneNode());
		}
	}

    // set up ProximityEffect
    let params = {
        threshold: 100,
        runoff:      0,
		jitter:    120,
        attack:      0.6,
        decay:       0.06,
        invert: true
    };

	var proxEffect = new ProximityEffect(document.querySelectorAll('*.childelement'), params);

	proxEffect.addStyle('scale',      [0.2, 1]);
    proxEffect.addStyle('brightness', [0, 650]);

</script>


</body>

</html>
