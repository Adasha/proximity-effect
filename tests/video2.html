<script src="../repo/src/ProximityEffect.js"></script>
<script src="../../frame-seq/repo/src/HTMLFrameSeqElement.js"></script>
<script>

    var rows = 5,
		cols = 5,
    	t = document.querySelector('#sampleelement'),
    	n = t.removeChild(t.querySelector('*.childelement'));

		for(var i=0; i<cols; i++)
		{
			for(var j=0; j<rows; j++)
			{
			    var e = t.appendChild(n.cloneNode(true)),
					v = e.querySelector('video'),
					x = i*100,
					y = j*100;

				e.style.left =  (x+ 50)+'px';
				e.style.top  =  (y+ 50)+'px';
				v.style.left = -(x+150)+'px';
				v.style.top  = -(y+ 50)+'px';
			}
		}

	var params = {
        threshold: 10,
        distance: 800,
    };

    var fader = new ProximityEffect(document.querySelectorAll('*.childelement'), params);

	fader.addEventListener('redraw', function(evt) {
		var v;
		for(var c=0; c<this.nodes.length; c++)
		{
			v = this.nodes[c].querySelector('video');
			v.currentTime = this.distanceFrom(c) * v.duration;
			//v.play();
		}
	});

</script>
