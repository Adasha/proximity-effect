<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, user-scalable=no">
	
    <title>adasha |||||| lab : proximity-effect</title>
		
	
    <link href="https://fonts.googleapis.com/css?family=Eater" rel="stylesheet">
    <style>


        #jabberwocky
        {
            font: 160% 'Eater', cursive;
            width: -webkit-max-content;
            width: -moz-max-content;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
            padding: 2em;
            color: #000;
            background: #eee;
            /* overflow-wrap: break-word;
            white-space: normal;
            word-wrap: normal; */
			perspective: 200px;
			/* enable for depth sort but slower */
			transform-style: preserve-3d;
        }
        *.line > *
        {
			display: inline-block;
			pointer-events: none;
        }



    </style>

</head>

<body>
    
<h1>ProximityEffect demo 6</h1>
    
        
<div id="content">
	

	<blockquote id="jabberwocky" class="centerpiece">
		<span class="line">’Twas brillig, and the slithy toves</span><br>
		<span class="line">Did gyre and gimble in the wabe:</span><br>
		<span class="line">All mimsy were the borogoves,</span><br>
		<span class="line">And the mome raths outgrabe.</span>
	</blockquote>
    
    
</div>

<script src="https://unpkg.com/event-target@latest/min.js"></script>
<script src="assets/WrapChars.min.js"></script>


<script type="module">
    import ProximityEffect from '../src/ProximityEffect.js';

    let poem = document.querySelector('*.centerpiece');
        WrapChars.wrap(poem, {
            split: 'word'
        });


	let els = document.querySelectorAll('*.line > *');
    let params = {
        threshold:  20,
        distance:  100,
		jitter:     50,
		direction: 'vertical',
        attack:      0.7,
        decay:       0.2,
		doPresetDistances: false,
		//invertDistancePreset: true
    };

    let proxEffect = new ProximityEffect(els, params);

	proxEffect.addStyle('translateX',                       [0, {value:  0, scatter:  50, scatterMethod: 'normal'}]);
	proxEffect.addStyle('translateY',                       [0, {value:  0, scatter:  50, scatterMethod: 'normal'}]);
	proxEffect.addStyle('translateZ',                       [0, {value: 25, scatter: 150, scatterMethod: 'uniform'}]);
	proxEffect.addStyle(   'rotateX',                       [0, {value:  0, scatter: 270, scatterMethod: 'normal'}]);
	proxEffect.addStyle(   'rotateY',                       [0, {value:  0, scatter: 270, scatterMethod: 'normal'}]);
	proxEffect.addStyle(   'rotateZ', [{value: 0, scatter: 10}, {value:  0, scatter:  90}]);

	proxEffect.addEventListener('ready', e => {

	});

	proxEffect.addEventListener('redraw', e => {
		for(let n=0; n<proxEffect.nodes.length; n++)
		{
			let z = proxEffect.getNodeIndexData(n, 'styles')[2].far;
			let d = proxEffect.distanceFromIndex(n);
			let f = Math.abs(z)*Math.pow(d, 2)*0.025;
			proxEffect.nodes[n].style['filter'] = `blur(${f}px) brightness(${50}%)`;
		}
	});

</script>


</body>
</html>
