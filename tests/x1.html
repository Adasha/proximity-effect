<script src="../assets/ProximityEffect.min.js"></script>

<script>

function init() {

    let params = {
        threshold: 100,
        runoff:      0,
        attack:      0.6,
        decay:       0.6,
		accuracy:    1
    };

	let fader = new ProximityEffect(document.querySelectorAll('*.cube'), params);
	fader.addEffect('rotateZ', 90, 0);
};

init();

</script>
